# Tanamanku — Docker Compose untuk development & production
# Jalankan:  docker compose up -d
# Build:     docker compose up -d --build
# Logs:      docker compose logs -f
# Stop:      docker compose down

services:
  # ── MySQL Database ──
  mysql:
    image: mysql:8.0
    container_name: tanamanku_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tanamanku
      MYSQL_USER: tanamanku
      MYSQL_PASSWORD: tanamanku_secret
      MYSQL_ROOT_PASSWORD: root_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tanamanku

  # ── phpMyAdmin (dev only) ──
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: tanamanku_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: tanamanku
      PMA_PASSWORD: tanamanku_secret
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tanamanku

  # ── Laravel Backend API ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tanamanku_backend
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "Tanamanku"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      APP_TIMEZONE: Asia/Jakarta
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: tanamanku
      DB_USERNAME: tanamanku
      DB_PASSWORD: tanamanku_secret
      FRONTEND_URL: http://localhost:5173
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - storage_upload:/var/www/html/storage/app/public
    networks:
      - tanamanku

  # ── React Web App ──
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: tanamanku_web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - tanamanku

volumes:
  mysql_data:
  storage_upload:

networks:
  tanamanku:
    driver: bridge
