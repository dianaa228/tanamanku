name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ── Lint & Code Quality ──
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo_mysql, zip, gd
          tools: composer:v2

      - name: Install backend dependencies
        run: cd backend && composer install --prefer-dist --no-progress

      - name: Run Laravel Pint (code style)
        run: cd backend && ./vendor/bin/pint --test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Run web build
        run: cd web && npm run build

  # ── Backend Tests ──
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: tanamanku_test
          MYSQL_USER: tanamanku
          MYSQL_PASSWORD: test_secret
          MYSQL_ROOT_PASSWORD: root_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot_secret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo_mysql, zip, gd
          tools: composer:v2
          coverage: xdebug

      - name: Install dependencies
        run: cd backend && composer install --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cd backend
          cp .env.example .env
          php artisan key:generate

      - name: Configure test environment
        run: |
          cd backend
          sed -i 's/DB_HOST=127.0.0.1/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=tanamanku/DB_DATABASE=tanamanku_test/' .env
          sed -i 's/DB_USERNAME=root/DB_USERNAME=tanamanku/' .env
          sed -i 's/DB_PASSWORD=/DB_PASSWORD=test_secret/' .env

      - name: Run migrations
        run: cd backend && php artisan migrate --force

      - name: Run tests
        run: cd backend && php artisan test --parallel

  # ── Build & Deploy (production) ──
  deploy:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: backend-test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t tanamanku-backend:latest ./backend

      - name: Build web image
        run: docker build -t tanamanku-web:latest ./web

      - name: List images
        run: docker images | grep tanamanku
